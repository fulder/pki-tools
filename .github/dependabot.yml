# Set update schedule for GitHub Actions

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pip" # bootstrap requirements.txt (uv itself)
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"
    versioning-strategy: increase
    # pip also parses pyproject.toml's PEP-621 deps, but has no concept of
    # uv.lock, so it would bump those without re-locking. Restrict it to the
    # uv pin in requirements.txt; the uv ecosystem block below owns the rest.
    allow:
      - dependency-name: "uv"

  - package-ecosystem: "uv" # project deps (pyproject.toml + uv.lock)
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"
