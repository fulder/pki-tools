name: test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        run: pip install --require-hashes -r requirements.txt

      - name: Install dependencies
        run: uv sync --group lint --group docs

      - name: Lint code
        run: uv run ruff check .

      - name: Test generate docs
        run: uv run mkdocs build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
      fail-fast: true
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install --require-hashes -r requirements.txt

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} --group test python -m pytest ./test

      - name: Run example files
        if: ${{ matrix.python-version == '3.13' }}
        run: |
          make run-examples
          git diff --exit-code ./docs/examples

      - name: Smokeshow
        if: ${{ matrix.python-version == '3.13' && github.actor != 'dependabot[bot]' && github.repository == 'fulder/pki-tools' }}
        env:
          SMOKESHOW_GITHUB_STATUS_DESCRIPTION: Coverage {coverage-percentage}
          SMOKESHOW_GITHUB_COVERAGE_THRESHOLD: 50
          SMOKESHOW_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKESHOW_GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SMOKESHOW_AUTH_KEY: ${{ secrets.SMOKESHOW_AUTH_KEY }}
        run: uv run --group test smokeshow upload htmlcov
